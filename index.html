<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Indicadores</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>📊 Dashboard de Indicadores</h1>
    <p>Visualização de indicadores de desempenho — dados estruturados via SQL</p>
  </header>

  <main>
    <section class="kpis" id="kpis"></section>

    <section class="graficos">
      <div class="card">
        <h2>Evolução de Vendas Mensais</h2>
        <canvas id="graficoVendas"></canvas>
      </div>
      <div class="card">
        <h2>Vendas por Canal</h2>
        <canvas id="graficoCanais"></canvas>
      </div>
    </section>
  </main>

  <footer>
    <p>Desenvolvido por Raphael Feijó Machado Pereira Monteiro —
       <a href="https://github.com/raphaelmachadotb-coder">GitHub</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
